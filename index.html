<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>carlol — Quietly Considered Goods</title>
  <meta name="description" content="carlol — a curated collection of quietly considered goods for the home and everyday life." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <div class="container nav">
      <div class="brand">carlol</div>
      <nav class="nav-links">
        <a href="#shop">Shop</a>
        <a href="#about">About</a>
        <a href="mailto:hello@carlol.store">Contact</a>
      </nav>
      <button class="cart-btn" id="cartToggle">
        Cart <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <div class="eyebrow">Spring Collection</div>
      <h1>Quietly considered goods for everyday life.</h1>
      <p>Thoughtfully made objects, built to last and to soften with use. Discover our small-batch collection.</p>
    </div>
  </section>

  <main class="container" id="shop">
    <div class="filters" id="filters"></div>
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <footer id="about">
    <div class="container">
      <div class="brand">carlol</div>
      <p>Quietly considered goods. Made to last.</p>
      <p style="margin-top:12px;"><a href="mailto:hello@carlol.store">hello@carlol.store</a></p>
    </div>
  </footer>

  <!-- Cart drawer -->
  <div class="overlay" id="overlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-head">
      <h3>Your Cart</h3>
      <button class="close-btn" id="closeCart">&times;</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot">
      <div class="cart-total">
        <span>Total</span>
        <span id="cartTotal">$0.00</span>
      </div>
      <button class="checkout-btn" id="checkoutBtn">Checkout</button>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <script src="products.js"></script>
  <script src="script.js"></script>
</body>
</html>
